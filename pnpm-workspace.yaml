# This project is a single package, NOT a monorepo.
# `onlyBuiltDependencies` is the valid pnpm 9 key for controlling post-install
# build scripts (replaces the invalid `allowBuilds` key).
packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - sharp
