<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- خلفية متدرجة -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- الخلفية الرئيسية -->
  <rect width="128" height="128" rx="20" fill="url(#grad1)"/>

  <!-- أيقونة الامتحان -->
  <rect x="25" y="25" width="78" height="78" rx="8" fill="rgba(255,255,255,0.9)"/>

  <!-- خطوط الأسئلة -->
  <line x1="35" y1="45" x2="85" y2="45" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="55" x2="75" y2="55" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="65" x2="90" y2="65" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>

  <!-- خيارات الإجابة -->
  <circle cx="45" cy="85" r="4" fill="none" stroke="#FF9800" stroke-width="2"/>
  <circle cx="65" cy="85" r="4" fill="none" stroke="#FF9800" stroke-width="2"/>
  <circle cx="85" cy="85" r="4" fill="#FF9800" stroke-width="2"/>

  <!-- علامة الاختبار -->
  <circle cx="105" cy="25" r="8" fill="#FF9800"/>
  <text x="105" y="30" text-anchor="middle" fill="white" font-size="12" font-family="Arial" font-weight="bold">?</text>

  <!-- النص الرئيسي -->
  <text x="64" y="110" text-anchor="middle" fill="white" font-size="14" font-family="Arial" font-weight="bold">Quiz Tester</text>
</svg>