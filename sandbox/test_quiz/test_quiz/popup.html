<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masar X Quiz Tester</title>
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input, select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.8);
        }

        .status.error {
            background: rgba(244, 67, 54, 0.8);
        }

        .status.info {
            background: rgba(33, 150, 243, 0.8);
        }

        .test-options {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .test-options.show {
            display: block;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: auto;
            margin: 0;
        }

        .progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }

        .log {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            display: none;
        }

        .log.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Masar X Quiz Tester</h1>

        <form id="quizForm">
            <div class="form-group">
                <label for="quizId">معرف الامتحان:</label>
                <input type="text" id="quizId" placeholder="أدخل معرف الامتحان" required>
            </div>

            <div class="form-group">
                <label for="testType">نوع الاختبار:</label>
                <select id="testType">
                    <option value="answers">إجابة تلقائية</option>
                    <option value="navigation">اختبار التنقل</option>
                    <option value="timer">اختبار المؤقت</option>
                    <option value="bulk">اختبار جماعي</option>
                </select>
            </div>

            <div class="test-options" id="bulkOptions">
                <label>عدد المحاولات:</label>
                <input type="number" id="numAttempts" value="5" min="1" max="50">
            </div>

            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="mode" value="auto" checked>
                    تلقائي
                </label>
                <label class="radio-option">
                    <input type="radio" name="mode" value="manual">
                    يدوي
                </label>
            </div>

            <button type="submit" id="startTest">🚀 بدء الاختبار</button>
            <button type="button" id="pageInfo" style="background: #2196F3;">📊 معلومات الصفحة</button>
            <button type="button" id="checkStatus" style="background: #FF9800;">🔍 فحص الحالة</button>
        </form>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status" id="status" style="display: none;"></div>

        <div class="log" id="log"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
