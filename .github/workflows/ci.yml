name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when new pushes arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read the repo contents.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # ESLint check
  # Job name is set to "ESLint" so the resulting check name matches the
  # legacy required_status_checks entry in the repo Ruleset.
  # ---------------------------------------------------------------------
  ESLint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # better-sqlite3's `install` postinstall is skipped via the
        # root `.npmrc`'s `neverBuiltDependencies[]=better-sqlite3`
        # (it has no Node 24 prebuild on Linux x64, and node-gyp
        # can't run in the CI sandbox). All other packages'
        # postinstalls (sharp, esbuild, @swc/core) still run as
        # normal so the web build can find their platform binaries.
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter web lint

  # ---------------------------------------------------------------------
  # next build check
  # Job name is set to "next build" so the resulting check name matches
  # the legacy required_status_checks entry in the repo Ruleset.
  #
  # Env vars below are placeholders. NEXT_PUBLIC_* vars are inlined into
  # the client bundle at build time and are public by design; the values
  # here are only used to satisfy module-load `throw new Error(...)`
  # checks in `src/lib/supabase.ts` and similar files. They never need
  # to point at a real Supabase/Cloudinary project.
  # ---------------------------------------------------------------------
  next-build:
    name: next build
    runs-on: ubuntu-latest
    # Placeholder values for the build-time env vars. They are obviously
    # not secrets (English words, no high-entropy patterns) so the
    # gitleaks-artifacts job doesn't flag the inlined NEXT_PUBLIC_*
    # values inside apps/web/.next/. The previous strings matched
    # Supabase / Cloudinary / Vercel rules after PR1 tightened the
    # gitleaks allowlist (PR27 follow-up / category A-3).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: replace-with-real-anon-key
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: cloudinary-cloud-name
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: cloudinary-upload-preset
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_COLLEGE_NAME: CI
      NEXT_PUBLIC_GA_ID: ""
      ANALYZE: "false"
      # Server-side placeholders. These are not consumed at build time
      # but are referenced by route handlers; placeholders keep any
      # defensive `throw` paths from blowing up.
      DATABASE_URL: postgresql://user:replace@localhost:5432/dbname
      VERCEL_MCP_BYPASS_SECRET: replace-with-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # See the ESLint job for the rationale.
        run: pnpm install --frozen-lockfile

      - name: Run next build
        run: pnpm --filter web build

  # ---------------------------------------------------------------------
  # Cross-workspace validation
  # Lightweight job that confirms every workspace package is healthy:
  # installs cleanly via the lockfile, reports as a workspace, and its
  # typecheck script exits cleanly.
  # ---------------------------------------------------------------------
  workspaces:
    name: workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # See the ESLint job for the rationale.
        run: pnpm install --frozen-lockfile

      - name: Verify workspaces are linked
        run: pnpm list -r --depth=-1

      - name: Cross-workspace typecheck
        run: pnpm -r --if-present typecheck

  # ---------------------------------------------------------------------
  # AI-endpoint grep (Spec 004 Phase 2, Task T014 — NON-NEGOTIABLE).
  #
  # Fails the build if any direct AI provider API endpoint string
  # (e.g. `api.openai.com`, `api.anthropic.com`) appears in code
  # outside `supabase/functions/**` and
  # `packages/shared/ai/__fixtures__/**`. This is the second of three
  # enforcement layers for the AI provider key boundary (the others
  # are the ESLint `no-restricted-imports` rule at error severity in
  # T013, and gitleaks on built artifacts in T015).
  #
  # Required status check registration: this job MUST be registered
  # as a required status check on the protected branch
  # (Branch protection rules → Require status checks to pass before
  # merging). The registration is a one-time repo setting via the
  # GitHub UI or `gh api` against the repo's ruleset. A CI job that
  # runs but isn't required is observability, not enforcement.
  # ---------------------------------------------------------------------
  ai-endpoint-grep:
    name: ai-endpoint-grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Deterministic ripgrep install: apt-get update is fragile on shared
      # runners (third-party mirrors, e.g. dl.google.com's chrome repo, can
      # serve stale indexes and fail the whole job with a Hash Sum mismatch
      # — happened on 2026-09-09 and blocked an otherwise-green PR). The
      # musl static binary has no system dependencies.
      - name: Install ripgrep
        run: |
          curl -sSfL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz -o /tmp/rg.tgz
          sudo tar -xzf /tmp/rg.tgz -C /usr/local/bin --strip-components=1 ripgrep-14.1.1-x86_64-unknown-linux-musl/rg
          rg --version

      - name: Run AI-endpoint grep
        run: bash .github/scripts/check-ai-provider-endpoints.sh

  # ---------------------------------------------------------------------
  # gitleaks on built artifacts (Spec 004 Phase 2, Task T015 —
  # NON-NEGOTIABLE).
  #
  # Runs gitleaks against the `apps/web/.next` build output and
  # (when the relevant build steps exist in Phase 3+) the Electron
  # asar and the Expo bundle. Fails the build on any known secret
  # shape — Supabase service-role JWT, OpenAI/Anthropic API key, etc.
  #
  # Why `--no-git`: we scan the built artifacts as files on disk, not
  # the git history. The repo-level scan (against tracked files) is
  # already covered by the default gitleaks run on PR/push.
  #
  # Required status check registration: same as the AI-endpoint grep
  # above. See T015 in specs/004-multi-platform-expansion/tasks.md
  # for the one-time Branch-protection setup.
  # ---------------------------------------------------------------------
  gitleaks-artifacts:
    name: gitleaks-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # See the ESLint job for the rationale.
        run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: replace-with-real-anon-key
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: cloudinary-cloud-name
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: cloudinary-upload-preset
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_COLLEGE_NAME: CI
          NEXT_PUBLIC_GA_ID: ""
          ANALYZE: "false"
          DATABASE_URL: postgresql://user:replace@localhost:5432/dbname
          VERCEL_MCP_BYPASS_SECRET: replace-with-real-secret
        run: pnpm --filter web build

      - name: Install gitleaks
        run: |
          GL_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan built artifacts
        id: scan
        # `--no-git` scans files on disk, not git history. The repo
        # itself is scanned by the default gitleaks pre-commit / push
        # hook (added in a follow-up). Here we only need the
        # built-artifact check, per T015.
        # `--source .` scans the entire current directory; the gitleaks
        # config's `[allowlist]` block (`.gitleaks.toml` at the repo
        # root) excludes safe templates like `.env.example`.
        # The structured JSON report is uploaded as a workflow artifact
        # so a future contributor can see per-leak rule/file/line details
        # without re-running the scan (gitleaks 8.x's `--log` output only
        # prints the summary "leaks found: N" line).
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-report"
          REPORT="$RUNNER_TEMP/gitleaks-report/scan.json"
          set +e
          gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1 \
            --report-path "$REPORT"
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error::gitleaks detected secrets in built artifacts. See $REPORT for the per-leak breakdown (uploaded as the gitleaks-report artifact)."
            exit $RC
          fi
        continue-on-error: false

      - name: Upload gitleaks report on failure
        if: failure() && steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report/scan.json
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------
  # Docs lint
  #
  # Lints the first-party Markdown (README, CONTRIBUTING, SECURITY,
  # CODE_OF_CONDUCT, CHANGELOG) with markdownlint-cli2 (config:
  # `.markdownlint.jsonc` at the repo root) and verifies every internal
  # (relative) link in those files resolves via
  # `.github/scripts/check-doc-links.sh`.
  #
  # External URLs are intentionally NOT fetched — network checks are
  # flaky in CI. Internal-only keeps this fast and deterministic.
  #
  # Not currently a required status check; promote it to required in
  # the branch ruleset once it has run green for a while.
  # ---------------------------------------------------------------------
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint Markdown
        run: npx -y markdownlint-cli2 README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md

      - name: Check internal doc links resolve
        run: bash .github/scripts/check-doc-links.sh

  # ---------------------------------------------------------------------
  # Translations single-source check (Spec 004 T038).
  # Fails if any app declares a local messages/ or locales/ directory;
  # the only translation source is packages/shared/src/messages/.
  # ---------------------------------------------------------------------
  translations:
    name: translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check translation source of truth
        run: bash .github/scripts/check-translations.sh

  # ---------------------------------------------------------------------
  # Workspace tests (Spec 004 T007 — `pnpm test` at root).
  # Runs every workspace that defines a `test` script (currently desktop;
  # web grows one with its test bootstrap).
  # ---------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # See the ESLint job for the rationale.
        run: pnpm install --frozen-lockfile

      - name: Run workspace tests
        run: pnpm -r --if-present test

  # ---------------------------------------------------------------------
  # E2E study-flow smoke (Spec 010 — MVP report G6.1).
  # Builds with placeholder envs EXCEPT the two Supabase client values.
  # NEXT_PUBLIC_* are inlined at build time; the anon key/URL are
  # publishable-by-design (client scope), so they come from repository
  # Variables — NOT Secrets, and NOT hardcoded here (the gitleaks rules
  # flag Supabase key patterns, and gitleaks-artifacts scans only its own
  # placeholder build, so the real values never enter its view).
  # Runs the Playwright happy path against `next start` on localhost.
  # ---------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require public Supabase variables
        if: ${{ vars.NEXT_PUBLIC_SUPABASE_URL == '' || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY == '' }}
        run: |
          echo "::error::Set repository Variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables tab; public-by-design, NOT secrets) to enable the e2e job."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # See the ESLint job for the rationale.
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app (placeholders + public Supabase variables)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: cloudinary-cloud-name
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: cloudinary-upload-preset
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_COLLEGE_NAME: CI
          NEXT_PUBLIC_GA_ID: ""
          ANALYZE: "false"
          DATABASE_URL: postgresql://user:replace@localhost:5432/dbname
          VERCEL_MCP_BYPASS_SECRET: replace-with-real-secret
        run: pnpm --filter web build

      - name: Start production server
        run: |
          nohup pnpm --filter web start > /tmp/next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/ar > /dev/null && echo "server up (attempt $((SECONDS / 2)))" && exit 0
            sleep 2
          done
          echo "server failed to start"; tail -50 /tmp/next-start.log; exit 1

      - name: Run e2e smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: pnpm --filter web test:e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Workflow lint (actionlint) — added 2026-09-18 after the Lighthouse
  # incident: an unparseable workflow YAML fails on ANY triggering event
  # with zero jobs and no logs ("invalid workflow file"), which no
  # required check caught. actionlint validates every file in
  # .github/workflows/ (syntax + expression semantics) so this class of
  # failure is caught here, on the PR that introduces it.
  # ---------------------------------------------------------------------
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint (pinned)
        run: |
          AL_VERSION="v1.7.7"
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/${AL_VERSION}/actionlint_${AL_VERSION#v}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: Lint all workflow files
        run: actionlint -color
