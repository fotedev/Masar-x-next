# ============================================================================
# Release Desktop App
#
# Tag-triggered pipeline that builds the Electron desktop installers
# (NSIS + Portable), generates electron-updater metadata (`latest.yml`,
# `*.blockmap`), and publishes everything as a GitHub Release on the
# SEPARATE PUBLIC RELEASES REPO `fotedev/masarx-releases`.
#
# Why a separate repo?
# --------------------
# The source code lives in `fotedev/Masar-x-next`, which is PRIVATE.
# GitHub Releases on a private repo are also private, which means:
#   - Anonymous `electron-updater` clients get 404 on `latest.yml`
#     and can never check for updates.
#   - The website's "Download" link returns 404 for unauthenticated
#     users.
# The fix: publish artifacts to `fotedev/masarx-releases` (PUBLIC)
# while keeping the source private. `electron-updater` reads from the
# public repo (anonymous, no auth needed), and the website can link
# directly to release assets. See AGENTS.md gotcha #16 and the
# "Release distribution" section for the full rationale.
#
# How the publish works (electron-builder does it all)
# ----------------------------------------------------
# The `apps/desktop/electron-builder.yml` `publish:` block targets
# `fotedev/masarx-releases` (a public repo). The default
# `GITHUB_TOKEN` only has access to the source repo
# (`Masar-x-next`), so we override it with `GH_RELEASES_TOKEN` — a
# Fine-grained PAT scoped to `fotedev/masarx-releases` with
# `Contents: Read and write`. This PAT is stored as a repo secret in
# `fotedev/Masar-x-next` (the source).
#
# The `build:all` script in `apps/desktop/package.json` invokes
# `electron-builder --win --x64` WITHOUT `--publish never`, so the
# default `onTagOrDraft` mode kicks in: on a tag, electron-builder
# generates the `.exe`, the `latest.yml` / `*.blockmap` metadata,
# AND publishes the GitHub Release on `masarx-releases` — all in
# one step. No separate `softprops/action-gh-release` step needed.
#
# (Earlier versions of this workflow used `softprops/action-gh-release`
# to do the publish. That had two problems: (a) `latest.yml` and
# `*.blockmap` weren't being uploaded because `electron-builder
# --publish never` was suppressing their generation, and (b) softprops
# uploads to the current repo by default unless `repository:` is
# passed explicitly, which sent releases to the wrong repo. Letting
# electron-builder handle the whole flow removes both problems.)
#
# Triggers
# --------
# - Push a tag matching `v*` (e.g. `git tag v0.5.6 && git push origin v0.5.6`).
#   The tag's version is what `electron-builder` reads from
#   `apps/desktop/package.json` (it MUST be bumped before tagging —
#   otherwise the release tag and the installer filename will diverge).
# - Manual run via the Actions UI's "Run workflow" button — useful for
#   smoke-testing the pipeline end-to-end without pushing a tag. Note
#   that `onTagOrDraft` mode skips publish on non-tag runs, so a
#   `workflow_dispatch` build will only produce `out/*.exe` locally
#   and not publish.
#
# What it does
# ------------
# 1. pnpm install (frozen lockfile) — installs all workspace deps.
# 2. `electron-builder install-app-deps` for the desktop workspace —
#    fetches the better-sqlite3 prebuild matched to Electron 32's ABI
#    (v128). Without this, better-sqlite3's `install` script falls
#    back to `node-gyp rebuild` against the system Node, producing a
#    `.node` file with the wrong ABI that won't load inside Electron.
# 3. Builds the Next.js web standalone bundle into
#    `apps/web/.next/standalone/`. The desktop installer ships this
#    bundle as an `extraResource` (see `electron-builder.yml`), so it
#    must be built before the desktop step.
# 4. Runs `pnpm --filter desktop run build:all`, which invokes
#    `electron-builder --win --x64`. The yml lists both `nsis` and
#    `portable` under `win.target`, so both files land in
#    `apps/desktop/out/` in one pass. `GH_TOKEN` is
#    `GH_RELEASES_TOKEN` so electron-builder can:
#      - read the previous release from the public releases repo
#        (to compute the differential blockmap)
#      - generate the `latest.yml` + `*.blockmap` metadata that
#        `electron-updater` consumes
#      - create the GitHub Release on `fotedev/masarx-releases` and
#        upload all assets
# 5. Lists the build artifacts as a sanity check (fails fast if the
#    build step silently produced no artifacts).
#
# Permissions
# -----------
# `contents: write` is required for electron-builder to create the
# release and upload assets. The actual write happens against
# `masarx-releases` via the `GH_RELEASES_TOKEN` PAT; the workflow's
# default `GITHUB_TOKEN` is only used for the checkout step.
#
# Out of scope
# ------------
# - macOS (.dmg + .zip) and Linux (.AppImage, .deb, .rpm) targets are
#   defined in `electron-builder.yml` but not built here. Add sibling
#   jobs (`build-macos:`, `build-linux:`) when those targets are ready.
#   The same `GH_RELEASES_TOKEN` PAT works for them — electron-builder
#   automatically picks the right `*.yml` and `*.blockmap` for each
#   platform based on the artifact names.
# - Authenticode signing (Windows) and notarization (macOS) env vars
#   are commented out in `electron-builder.yml`; add them as repo
#   secrets and reference via `${{ secrets.* }}` when the EV cert
#   lands in Phase 8.
# ============================================================================

name: Release Desktop App

# `on:` is a YAML reserved keyword; quoting avoids parser issues.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # better-sqlite3's `install` postinstall is the only one we
        # need to skip on windows-latest. It's listed in the root
        # `.npmrc` under `neverBuiltDependencies[]=better-sqlite3`,
        # so pnpm skips it for us. All other packages (electron,
        # esbuild, sharp, @swc/core, @parcel/watcher) still run their
        # postinstalls — in particular, the electron postinstall
        # downloads the Electron 32.2.0 binary, which the next step
        # relies on. We previously used `--ignore-scripts` here, but
        # that also skipped electron's postinstall, leaving
        # `electron-builder install-app-deps` unable to determine
        # the Electron version. Using `neverBuiltDependencies` is
        # more targeted.
        run: pnpm install --frozen-lockfile

      - name: Install Electron native modules
        # better-sqlite3 v11.10.0 ships electron-v128 prebuilds
        # (Electron 32's ABI). The previous step intentionally
        # skipped its postinstall (see the comment on
        # `Install dependencies`), so better-sqlite3 has no `.node`
        # binary on disk yet. This step runs
        # `prebuild-install --runtime electron --target 32.2.0` to
        # fetch the correct prebuild (electron-v128, ABI 128) without
        # falling back to node-gyp.
        run: pnpm --filter desktop exec electron-builder install-app-deps

      - name: Build Web standalone app
        # NEXT_PUBLIC_* vars are inlined into the client bundle at build
        # time. The desktop installer packages this bundle, so the values
        # here must be the production Supabase / Cloudinary / site URL
        # for the installed app to talk to the right backend. The actual
        # values are pulled from repo secrets (set via `gh secret set`)
        # so the workflow yml never contains real anon keys.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # The Cloudinary cloud name + upload preset are also needed by
          # the client. Set the matching repo secrets if you have them.
          # If unset, the build still succeeds (Cloudinary returns a 401
          # at runtime, which is acceptable for installers that ship
          # before Cloudinary creds are finalized).
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || 'ci-placeholder' }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET || 'ci-placeholder' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_COLLEGE_NAME: CI Placeholder
          NEXT_PUBLIC_GA_ID: ""
          ANALYZE: "false"
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          VERCEL_MCP_BYPASS_SECRET: ci-placeholder
        run: pnpm --filter web build

      - name: Build & Publish Desktop installers (NSIS + Portable)
        # `build:all` is `tsc -p tsconfig.build.json && electron-builder
        # --win --x64`. The yml lists both `nsis` and `portable` under
        # `win.target`, so both files land in `apps/desktop/out/` in one
        # pass. The script does NOT pass `--publish never`, so
        # electron-builder uses its default `onTagOrDraft` mode:
        # on a tag, it generates the `latest.yml` + `*.blockmap`
        # metadata AND creates the GitHub Release on
        # `fotedev/masarx-releases` (per the `publish:` block in
        # `apps/desktop/electron-builder.yml`). On non-tag runs
        # (e.g. `workflow_dispatch`), it just builds the .exe files
        # and skips publish.
        #
        # GH_TOKEN is the `GH_RELEASES_TOKEN` PAT — a Fine-grained
        # token scoped to `fotedev/masarx-releases` with
        # `Contents: Read and write`. The default `GITHUB_TOKEN`
        # only has access to the source repo `Masar-x-next`, so it
        # CAN'T create releases on `masarx-releases`.
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: pnpm --filter desktop run build:all

      - name: List build artifacts
        # Sanity check after build+publish — fails fast if the build
        # step silently produced no artifacts (electron-builder would
        # have errored out on missing outputs otherwise, but this
        # surfaces exact file sizes in the run log).
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/out/*.exe, apps/desktop/out/latest*.yml, apps/desktop/out/*.blockmap `
            -ErrorAction SilentlyContinue |
            Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}} |
            Format-Table -AutoSize
