name: Build Native Mobile APK

# Builds the REAL native Expo / React Native app (apps/mobile) into a signed
# release APK. The android/ project is prebuild-generated and committed, so CI
# only needs npm ci + gradle. Signing uses the shared Masar X upload keystore
# (repo secrets MASARX_KEYSTORE_B64 + MASARX_KEYSTORE_PASSWORD) â€” the same
# identity as the Capacitor wrapper, so this app can replace it in place.

on:
  workflow_dispatch:
  push:
    branches:
      - apk-build
    paths:
      - ".github/workflows/build-mobile-apk.yml"
      - "apps/mobile/**"

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    name: Build native release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Resolve signing keystore
        env:
          MASARX_KEYSTORE_B64: ${{ secrets.MASARX_KEYSTORE_B64 }}
          MASARX_KEYSTORE_PASSWORD: ${{ secrets.MASARX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${MASARX_KEYSTORE_B64:-}" ] && [ -n "${MASARX_KEYSTORE_PASSWORD:-}" ]; then
            echo "Using shared upload keystore from repository secrets."
            # Signing material lives outside the working tree (never committed, never packaged).
            printf '%s' "$MASARX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/masarx-upload.jks"
            printf '%s' "$MASARX_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/.masarx-key-pass"
          else
            echo "::error::Missing MASARX_KEYSTORE_B64 / MASARX_KEYSTORE_PASSWORD secrets."
            exit 1
          fi

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # Public client config â€” values already stored as repo secrets
          # (the anon key ships in the public web bundle by design).
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Fail loudly if the public Supabase env is missing â€” Metro would
          # otherwise silently inline empty strings and the app breaks at runtime.
          : "${EXPO_PUBLIC_SUPABASE_URL:?missing NEXT_PUBLIC_SUPABASE_URL secret}"
          : "${EXPO_PUBLIC_SUPABASE_ANON_KEY:?missing NEXT_PUBLIC_SUPABASE_ANON_KEY secret}"
          export MASARX_KEYSTORE="$RUNNER_TEMP/masarx-upload.jks"
          export MASARX_STORE_PASSWORD="$(cat "$RUNNER_TEMP/.masarx-key-pass")"
          export MASARX_KEY_PASSWORD="$MASARX_STORE_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify native artifacts inside the APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          echo "### Native APK checks" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -E "libhermes|index.android.bundle" | tee native-check.txt >> /dev/null || true
          if grep -q "libhermes" native-check.txt && grep -q "index.android.bundle" native-check.txt; then
            echo "- Hermes engine + RN bundle present (real native build OK)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::APK is missing Hermes/RN bundle â€” unexpected."
            exit 1
          fi
          if unzip -l "$APK" | grep -q "assets/public/index.html"; then
            echo "::error::Found Capacitor wrapper assets inside the native APK â€” build contamination."
            exit 1
          fi
          echo "- No Capacitor wrapper assets (not a WebView shell OK)" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk masarx-1.0.0-native-release.apk
          sha256sum masarx-1.0.0-native-release.apk | tee NATIVE_APK_SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masarx-native-apk
          path: |
            apps/mobile/masarx-1.0.0-native-release.apk
            apps/mobile/NATIVE_APK_SHA256SUMS.txt
          if-no-files-found: error
