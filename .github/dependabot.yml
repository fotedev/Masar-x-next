# Dependabot configuration (Spec 009 §5 / MVP report G3.6).
# npm "/" is recursive across all pnpm workspace manifests (root, apps/*, packages/*).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    reviewers:
      - fotedev
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major bumps stay ungrouped (Electron pinned exact per I6 — majors need a spec).
    ignore:
      # Electron major/minor bumps require a dedicated upgrade spec (I11) with a
      # packaged-launch + smoke verification pass — handle via a spec, not
      # autodrift. Patch-level security fixes still come through. (Spec 014
      # executed the 32→44 upgrade; the desktop has no native modules anymore,
      # so future bumps no longer carry an ABI-pairing risk.)
      - dependency-name: electron
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Expo SDK majors are held (owner-flagged 2026-09-19, reversible — same
      # precedent as the Cloudinary preset): mobile is pinned to Expo SDK 51,
      # has no test suite yet, and the SDK upgrade belongs to the post-MVP
      # mobile queue. PRs #34 (expo-secure-store 13→57) / #36
      # (expo-document-picker 12→57) would break against SDK 51 with no test
      # to catch it. Minors/patches keep flowing. expo* packages exist only in
      # apps/mobile, so the name patterns scope this hold to mobile without
      # splitting the recursive npm entry.
      - dependency-name: expo
        update-types:
          - version-update:semver-major
      - dependency-name: expo-*
        update-types:
          - version-update:semver-major
      # AsyncStorage 1.x→3.x is held (owner decision 2026-09-29, reversible):
      # the isolated major skips two majors, needs RN >= 0.76 + Expo SDK 53+
      # with the new expo plugin plus removeMany/getMany migration
      # (read-cache.ts multiRemove). Mobile is pinned to SDK 51 + RN 0.74.5,
      # so this belongs in the post-MVP SDK upgrade spec, not autodrift.
      # PR #33 closed for this reason. 1.x patches still flow.
      - dependency-name: "@react-native-async-storage/async-storage"
        versions: [">= 2.0.0"]
      # react-native past 0.74.5 is held (owner decision 2026-09-29,
      # reversible): 0.x minors are breaking and 0.87.x needs new-arch RN +
      # newer Expo + likely React 19, which breaks the SDK 51 pin. PR #58
      # smuggled 0.74.5→0.87.1 through the minor-and-patch group and broke
      # mobile typecheck + expo export. Handled via the SDK upgrade spec.
      - dependency-name: react-native
        versions: ["> 0.74.5"]
      # react-dom past 19.2.4 is held (2026-09-29, reversible): apps/web pins
      # react AND react-dom to exactly 19.2.4, and the minor-and-patch group
      # bumped only react-dom (PR #68), producing react 19.2.4 + react-dom
      # 19.3.0 — "Incompatible React versions" across 34 vitest suites. The
      # pair moves together in a dedicated React upgrade, never via autodrift.
      - dependency-name: react-dom
        versions: ["> 19.2.4"]
      # @types/react-dom tracks the held react-dom runtime (types for 19.3
      # would describe APIs the pinned 19.2.4 does not have).
      - dependency-name: "@types/react-dom"
        versions: [">= 19.3.0"]
      # katex >= 0.17 is held (2026-09-29, reversible): react-katex@3.1.0
      # hard-depends on katex ^0.16.0, so a 0.18.x bump (PR #68) yields a
      # skewed duplicate KaTeX install (fonts/CSS version mismatch). katex
      # moves together with a react-katex replacement decision, not solo.
      - dependency-name: katex
        versions: [">= 0.17.0"]
      # dotlottie-react >= 0.19 is held (2026-09-29, reversible): the
      # apps/web postinstall race-condition fix (scripts/apply-lottie-patch.mjs)
      # matches only 0.18.x minified bundles — on 0.19.x it exits 0 without
      # patching and the "Failed to load animation with id: Main Scene" worker
      # race returns silently. Re-derive the patch for 0.19.x first, then lift.
      - dependency-name: "@lottiefiles/dotlottie-react"
        versions: [">= 0.19.0"]
      # --- Holds batch 2026-10-18 (owner-approved cleanup of open PRs #128/
      # #116/#117/#125/#123/#109; each entry is reversible — delete it and
      # dependabot re-proposes on the next weekly run) ---
      # framer-motion >= 13 is held: 12→14 (PR #128) is a web runtime
      # animation major needing a manual animation smoke pass that the MVP
      # Lock defers; the 12→13 bump was already parked by the 2026-10-05
      # triage. 12.x minors/patches still flow via the group.
      - dependency-name: framer-motion
        versions: [">= 13"]
      # lucide-react >= 1 is held: the 0.577→1.x major breaks the web build
      # outright (PR #125 red on next build/e2e/Vercel — same verdict as
      # #114 before it) and needs deliberate icon-API adaptation, post-MVP.
      # 0.x minors/patches still flow.
      - dependency-name: lucide-react
        versions: [">= 1"]
      # react-navigation v7 is held as a pair (PRs #116/#117): native-stack 7
      # requires native 7, the upgrade can need navigation-structure code
      # changes, and the 2026-10-05 triage gated the pair on a real device
      # smoke — not possible under the MVP Lock. 6.x patches still flow.
      - dependency-name: "@react-navigation/native"
        versions: [">= 7"]
      - dependency-name: "@react-navigation/native-stack"
        versions: [">= 7"]
      # react above 19.2.4 is held (PRs #123/#138): apps/mobile pins react
      # 18.2.0 via the Expo SDK 51 / RN 0.74.5 holds above, and apps/web's
      # react is paired with the react-dom hold at exactly 19.2.4 — react
      # moves in that dedicated React upgrade, never solo. The original
      # >= 19.3 predicate let react 19.2.9 slip through (PR #138) on BOTH
      # sides: web would break the pinned react/react-dom pair (the PR #68
      # mismatch class that broke 34 vitest suites) and mobile 19.x breaks
      # the RN 0.74.5 peer range — so the predicate mirrors the react-dom
      # hold exactly.
      - dependency-name: react
        versions: ["> 19.2.4"]
      # @vitest/coverage-v8 >= 3 is held (PR #109): the coverage plugin must
      # move in lockstep with the vitest core major (both at 2.1.8), else
      # coverage runs break silently — CI never runs --coverage, so the
      # break would only surface locally. Both majors belong to one
      # dedicated vitest upgrade, not autodrift.
      - dependency-name: "@vitest/coverage-v8"
        versions: [">= 3"]
      # --- Holds wave 2, 2026-10-18 (same owner-approved cleanup: majors
      # dependabot re-proposed after #132/#111/#126/#142 landed; PRs
      # #136/#137/#138/#139/#140/#141/#143) — each entry reversible, delete
      # it and dependabot re-proposes on the next weekly run ---
      # react-navigation v7 trio completion: bottom-tabs 7 (PR #137) pairs
      # with the held native/native-stack 7 — all three merge together in
      # the same device-smoke-gated upgrade.
      - dependency-name: "@react-navigation/bottom-tabs"
        versions: [">= 7"]
      # react-native-screens >= 4 is held (PR #136): navigation v7 requires
      # screens 4, so it belongs to the same navigation upgrade as the
      # holds above, not autodrift.
      - dependency-name: react-native-screens
        versions: [">= 4"]
      # react-native-safe-area-context >= 5 is held (PR #140): mobile
      # major coupled to the same navigation/SDK upgrade window.
      - dependency-name: react-native-safe-area-context
        versions: [">= 5"]
      # @sentry/react-native >= 7 is held (PR #143): 6→8 skips a major and
      # the mobile Sentry SDK needs its own verified upgrade pass (spec 023
      # territory), not autodrift.
      - dependency-name: "@sentry/react-native"
        versions: [">= 7"]
      # vite-plugin-pwa >= 2 is held (PR #139): web dev major with a changed
      # config surface — deliberate migration pass, post-MVP.
      - dependency-name: vite-plugin-pwa
        versions: [">= 2"]
      # eslint >= 10 is held (PR #141): dev major; flat-config and plugin
      # ecosystem compatibility needs a dedicated pass, not autodrift.
      - dependency-name: eslint
        versions: [">= 10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    reviewers:
      - fotedev
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
