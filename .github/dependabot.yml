# Dependabot configuration (Spec 009 §5 / MVP report G3.6).
# npm "/" is recursive across all pnpm workspace manifests (root, apps/*, packages/*).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    reviewers:
      - fotedev
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major bumps stay ungrouped (Electron pinned exact per I6 — majors need a spec).
    ignore:
      # Electron major/minor bumps require a dedicated upgrade spec (I11) with a
      # packaged-launch + smoke verification pass — handle via a spec, not
      # autodrift. Patch-level security fixes still come through. (Spec 014
      # executed the 32→44 upgrade; the desktop has no native modules anymore,
      # so future bumps no longer carry an ABI-pairing risk.)
      - dependency-name: electron
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Expo SDK majors are held (owner-flagged 2026-09-19, reversible — same
      # precedent as the Cloudinary preset): mobile is pinned to Expo SDK 51,
      # has no test suite yet, and the SDK upgrade belongs to the post-MVP
      # mobile queue. PRs #34 (expo-secure-store 13→57) / #36
      # (expo-document-picker 12→57) would break against SDK 51 with no test
      # to catch it. Minors/patches keep flowing. expo* packages exist only in
      # apps/mobile, so the name patterns scope this hold to mobile without
      # splitting the recursive npm entry.
      - dependency-name: expo
        update-types:
          - version-update:semver-major
      - dependency-name: expo-*
        update-types:
          - version-update:semver-major
      # AsyncStorage 1.x→3.x is held (owner decision 2026-09-29, reversible):
      # the isolated major skips two majors, needs RN >= 0.76 + Expo SDK 53+
      # with the new expo plugin plus removeMany/getMany migration
      # (read-cache.ts multiRemove). Mobile is pinned to SDK 51 + RN 0.74.5,
      # so this belongs in the post-MVP SDK upgrade spec, not autodrift.
      # PR #33 closed for this reason. 1.x patches still flow.
      - dependency-name: "@react-native-async-storage/async-storage"
        versions: [">= 2.0.0"]
      # react-native past 0.74.5 is held (owner decision 2026-09-29,
      # reversible): 0.x minors are breaking and 0.87.x needs new-arch RN +
      # newer Expo + likely React 19, which breaks the SDK 51 pin. PR #58
      # smuggled 0.74.5→0.87.1 through the minor-and-patch group and broke
      # mobile typecheck + expo export. Handled via the SDK upgrade spec.
      - dependency-name: react-native
        versions: ["> 0.74.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    reviewers:
      - fotedev
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
