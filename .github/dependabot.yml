# Dependabot configuration (Spec 009 §5 / MVP report G3.6).
# npm "/" is recursive across all pnpm workspace manifests (root, apps/*, packages/*).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    reviewers:
      - fotedev
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major bumps stay ungrouped (Electron pinned exact per I6 — majors need a spec).
    ignore:
      # Electron major/minor bumps require the better-sqlite3 ABI + release-pipeline
      # work (spec 005 / 02-release-pipeline.md) — handle via a dedicated upgrade,
      # not autodrift. Patch-level security fixes still come through.
      - dependency-name: electron
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # better-sqlite3 ANY bump is held: its prebuilt .node binaries must match the
      # pinned Electron's ABI (v128 for Electron 32 — see electron-builder.yml
      # npmRebuild note). Desktop vitest fails environmentally (G5.2), so CI cannot
      # catch a broken electron↔better-sqlite3 pairing — a clean-merging PR would
      # be a silent desktop break. Bump it together with Electron in the G5.1
      # post-MVP upgrade.
      - dependency-name: better-sqlite3
      # Expo SDK majors are held (owner-flagged 2026-09-19, reversible — same
      # precedent as the Cloudinary preset): mobile is pinned to Expo SDK 51,
      # has no test suite yet, and the SDK upgrade belongs to the post-MVP
      # mobile queue. PRs #34 (expo-secure-store 13→57) / #36
      # (expo-document-picker 12→57) would break against SDK 51 with no test
      # to catch it. Minors/patches keep flowing. expo* packages exist only in
      # apps/mobile, so the name patterns scope this hold to mobile without
      # splitting the recursive npm entry.
      - dependency-name: expo
        update-types:
          - version-update:semver-major
      - dependency-name: expo-*
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    reviewers:
      - fotedev
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
