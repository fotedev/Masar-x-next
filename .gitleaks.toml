# gitleaks configuration for the Masar X monorepo (Spec 004, Tasks
# T008 / T015). See https://github.com/gitleaks/gitleaks for the full
# schema.
#
# This config extends gitleaks' default rule set (~150 detectors
# covering Supabase service-role JWTs, OpenAI/Anthropic/GitHub/AWS
# tokens, and high-entropy generic secrets) and adds an allowlist for
# files that look secret-shaped but are safe to scan over:
#
#   - `.env.{example,template,sample}`: documentation templates with
#     placeholder values.
#   - `node_modules/`, `.pnpm/`, `pnpm-lock.yaml`: third-party code
#     and the regenerated pnpm lockfile. Third-party packages'
#     test fixtures and changelogs routinely contain strings that
#     match gitleaks' high-entropy generic rules; scanning these
#     produces false positives that drown the real signal.
#   - `packages/shared/src/ai/__fixtures__/**`: test fixtures that
#     intentionally contain the AI provider endpoint strings the
#     `ai-endpoint-grep` check (T014) allows.
#   - `.github/scripts/check-ai-provider-endpoints.sh`: the T014
#     script itself, which contains the regex patterns literally.
#   - `specs/**`, `docs/**`, `*.md`: documentation files that
#     discuss the secret formats in plain prose.
#
# What the config DELIBERATELY does NOT allowlist:
#   - `apps/web/.next/**`: the contract for T015 (per
#     specs/004-multi-platform-expansion/tasks.md) is to scan
#     the built artifacts so a key introduced by build-time
#     string concatenation is caught. Adding `.next/` to the
#     allowlist would defeat the entire point of the T015 job.
#   - `apps/desktop/dist/**` and `apps/mobile/.expo/**`: same
#     reason; these land in their respective user-story phases
#     and are then added to the scan path explicitly.
#   - Any real `.env`, `.env.local`, or `.env.production`:
#     gitignored, never reach the scanner.

title = "Masar X gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow third-party code, lockfiles, env templates, and test fixtures"
paths = [
  # Env templates with placeholder values
  '''(^|/)(\.env\.example|\.env\.template|\.env\.sample)$''',

  # pnpm's workspace store and the lockfile (T008 already added the
  # gitleaks config; this is the same allowlist concept extended to
  # the build's transitive state). `node_modules/` and `.pnpm/`
  # contain third-party code whose test fixtures and docs routinely
  # include strings that match gitleaks' high-entropy rules. The
  # lockfile is regenerated on every install and contains SHAs that
  # occasionally trip the generic detector.
  '''(^|/)node_modules/''',
  '''(^|/)\.pnpm/''',
  '''(^|/)pnpm-lock\.yaml$''',

  # Test fixtures allowed by the ai-boundary contract (T014's
  # allowlist; mirrored here so T015 doesn't double-report them).
  '''(^|/)packages/shared/src/ai/__fixtures__/''',

  # The T014 CI script itself, which contains the literal regex
  # patterns gitleaks would otherwise match against.
  '''(^|/)\.github/scripts/check-ai-provider-endpoints\.sh$''',

  # The T015 CI workflow file (in case a future contributor adds a
  # test fixture URL to the step).
  '''(^|/)\.github/workflows/ci\.yml$''',

  # Documentation that discusses the secret formats in plain prose.
  '''(^|/)specs/''',
  '''(^|/)docs/''',
  '''\.md$''',

  # Build outputs other than the contract-scanned `.next/`
  # (Electron asar and Expo bundle land here when their phases
  # add the scan path explicitly).
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)out/''',

  # Coverage / cache directories. `.next/cache/` in particular holds the
  # webpack production packs (`.pack` files) and `.previewinfo` — these
  # are the cached compiled output, NOT the shipped artifact. The
  # shipped bundle lives in `apps/web/.next/server/` (server runtime)
  # and `apps/web/.next/static/` (client runtime); both remain in the
  # scan path. Webpack packs and previewinfo are excluded because the
  # placeholder env vars inlined into them (e.g.
  # `ci-placeholder-anon-key`) are matched by gitleaks' generic
  # high-entropy rule even though they're not real secrets.
  '''(^|/)coverage/''',
  '''(^|/)\.turbo/''',
  '''(^|/)apps/web/\.next/cache/''',
  '''\.cache/''',
]
