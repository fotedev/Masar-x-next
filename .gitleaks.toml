# gitleaks configuration for the Masar X monorepo (Spec 004, Tasks
# T008 / T015). See https://github.com/gitleaks/gitleaks for the full
# schema.
#
# This config extends gitleaks' default rule set (~150 detectors
# covering Supabase service-role JWTs, OpenAI/Anthropic/GitHub/AWS
# tokens, and high-entropy generic secrets) and adds an allowlist for
# files that look secret-shaped but are safe to scan over:
#
#   - `.env.{example,template,sample}`: documentation templates with
#     placeholder values.
#   - `node_modules/`, `.pnpm/`, `pnpm-lock.yaml`: third-party code
#     and the regenerated pnpm lockfile. Third-party packages'
#     test fixtures and changelogs routinely contain strings that
#     match gitleaks' high-entropy generic rules; scanning these
#     produces false positives that drown the real signal.
#   - `packages/shared/src/ai/__fixtures__/**`: test fixtures that
#     intentionally contain the AI provider endpoint strings the
#     `ai-endpoint-grep` check (T014) allows.
#   - `.github/scripts/check-ai-provider-endpoints.sh`: the T014
#     script itself, which contains the regex patterns literally.
#   - `specs/**`, `docs/**`, `*.md`: documentation files that
#     discuss the secret formats in plain prose.
#
# ARTIFACT DIRECTORIES MUST REMAIN SCANNABLE (spec 004 T015).
# `dist/`, `build/`, `out/` and `.next/` are deliberately NOT
# allowlisted: the `gitleaks-artifacts` CI job runs
# `gitleaks detect --no-git` over the built bundles (apps/web/.next
# today; the Electron asar and the Expo bundle as their phases land)
# so that a key introduced by build-time string concatenation is
# still caught. Re-adding artifact paths here would defeat the
# entire point of the T015 / T049-T051 artifact-scan contract.
#
# The config also does NOT allowlist any real `.env`, `.env.local`,
# or `.env.production`: they are gitignored and never reach the
# scanner.

title = "Masar X gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow third-party code, lockfiles, env templates, and test fixtures"
paths = [
  # Env templates with placeholder values
  '''(^|/)(\.env\.example|\.env\.template|\.env\.sample)$''',

  # pnpm's workspace store and the lockfile. `node_modules/` and
  # `.pnpm/` contain third-party code whose test fixtures and docs
  # routinely include strings that match gitleaks' high-entropy
  # rules. The lockfile is regenerated on every install and contains
  # SHAs that occasionally trip the generic detector.
  '''(^|/)node_modules/''',
  '''(^|/)\.pnpm/''',
  '''(^|/)pnpm-lock\.yaml$''',

  # Test fixtures allowed by the ai-boundary contract (T014's
  # allowlist; mirrored here so T015 doesn't double-report them).
  '''(^|/)packages/shared/src/ai/__fixtures__/''',

  # The T014 CI script itself, which contains the literal regex
  # patterns gitleaks would otherwise match against.
  '''(^|/)\.github/scripts/check-ai-provider-endpoints\.sh$''',

  # The T015 CI workflow file (in case a future contributor adds a
  # test fixture URL to the step).
  '''(^|/)\.github/workflows/ci\.yml$''',

  # Documentation that discusses the secret formats in plain prose
  # (e.g. docs/security/secret-leak-runbook.md, T056).
  '''(^|/)specs/''',
  '''(^|/)docs/''',
  '''\.md$''',

  # Next.js build-time artifacts containing the auto-generated
  # Preview Mode keys (`previewModeSigningKey` /
  # `previewModeEncryptionKey`). These are 256-bit random values
  # Next.js embeds in its manifest files for the ISR preview
  # workflow. They:
  #   - regenerate on every `next build` (no build-to-build reuse),
  #   - are not used in this project (no `draftMode()` or
  #     `previewModeId` consumer in `apps/web/src/`),
  #   - ship to every Next.js deployment as part of the public
  #     `.next` output, so they have no secrecy value.
  # Five specific files are listed (not a directory allowlist) so
  # the T015 artifact-scan contract still catches real secrets
  # introduced by build-time string concatenation. See PR27
  # follow-up "fix(d): allowlist Next.js Preview Mode manifest
  # fields" for the diagnostic and the 10-leak breakdown.
  '''(?:^|[/\\])apps[/\\]web[/\\]\.next[/\\](?:cache[/\\]\.previewinfo|prerender-manifest\.json|server[/\\]middleware-manifest\.json)$''',
  '''(?:^|[/\\])apps[/\\]web[/\\]\.next[/\\]standalone[/\\]apps[/\\]web[/\\]\.next[/\\](?:prerender-manifest\.json|server[/\\]middleware-manifest\.json)$''',
]