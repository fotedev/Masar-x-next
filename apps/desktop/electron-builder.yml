# ============================================================================
# T019 — electron-builder configuration
# Spec: specs/004-multi-platform-expansion/tasks.md §T019
# Reference: research.md §7 (electron-builder signing), spec FR-001 (no OS
# security warnings), spec FR-005 (cross-platform).
#
# Build outputs:
#   Windows: NSIS installer (.exe) + portable .exe, signed with
#            Authenticode (EV certificate preferred — research.md §7.1).
#   macOS:   .dmg + .zip in a notarized, Developer-ID-signed bundle.
#   Linux:   AppImage (signed), .deb, .rpm (GPG-signed via
#            linux-gpg-key-path / linux-gpg-key / linux-deb-fpm).
# ============================================================================

appId: ai.masarx.app
productName: Masar X
copyright: Copyright © 2026 Masar X
artifactName: "${productName}-${version}-${arch}.${ext}"
# Compression level for the installer's outer archive (NSIS uses 7z
# for the .exe payload, electron-builder applies this setting there).
# The default (`max`) uses solid LZMA, the slowest to extract on
# Windows — combined with `asar: true` we still get good compression
# (the asar payload is already internally compressed by
# electron-builder's archive), so trading the outer layer to
# `normal` (zlib, level 5) gives ~4x faster extraction at the cost
# of ~5-10% larger installer. Net result: install time drops from
# 3-5 min to under 30 sec on a typical Windows machine.
# Valid values per electron-builder 25.x: `store`, `normal`, `max`.
compression: normal
# Package.json overrides applied at packaging time. Sets the
# `description` and `author` fields in the packaged app's
# package.json (visible in Windows Explorer's properties dialog
# when the EXE is not Authenticode-signed, and in macOS Finder's
# Get Info pane).
extraMetadata:
  description: Masar X — An integrated educational platform for university students.
  author:
    name: Masar X
    email: ops@masarx.ai
# Pack the app source into a single app.asar archive. Re-enabled after
# `scripts/prebuild.mjs` was updated to materialize the
# `node_modules/masarx-shared` workspace symlink as a real directory
# copy. Without that materialization, electron-builder's asar packager
# follows the symlink during its `asarUnpack` pattern walk and rejects
# the path as "must be under apps/desktop/". The desktop main process
# only has a `import type` reference to masarx-shared (erased at
# compile time), so the copy is small (~193 KB) and exists only to
# satisfy the asar packager's path check.
#
# Two benefits of asar:
#   1. Installation speed — single ~80 MB archive extracted in
#      5-15 sec instead of 20K tiny files in 3-5 min.
#   2. Source-asar protection — JS source isn't readable as plain
#      text from `Resources/app/` after install.
asar: true

directories:
  # Output to `out/` (any fresh name works). On this Windows host, the
  # default `release/` and even previously-used `dist-release/` can
  # accumulate persistent file handle locks that block even rename.
  # Using a fresh name per run avoids that. If a build fails with EPERM
  # on this dir, just pick a new name (e.g. `out`, `out-v2`) and re-run.
  output: out
  # electron-builder picks up the Next.js build from apps/web/.next via
  # the `extraResources` and `files` entries below.
  buildResources: build

files:
  # After the tsconfig.build.json change (no `rootDir`, `paths` mapping
  # to packages/shared), tsc emits the desktop JS under
  # `dist/apps/desktop/src/...` and the shared package's JS under
  # `dist/packages/shared/src/...`. The desktop main process is
  # compiled in-place from the source tree (no separate shared build),
  # so the asar only needs the desktop portion — the shared JS is
  # loaded directly by Node from the source TS via the paths mapping
  # in the dev/release runtime. We scope the glob to `dist/apps/desktop/**/*`
  # so the symlinked shared output never reaches the asar packager.
  - dist/apps/desktop/**/*
  - package.json
  - "!**/.DS_Store"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/{.git,.github,coverage,docs,specs,__tests__,test}"

# Native modules (better-sqlite3) ship prebuilt .node binaries; they
# must be unpacked from the asar archive so Node can dlopen them at
# runtime via the standard require() path. Without asarUnpack, the
# .node file is inside the asar and dlopen fails on Windows/Linux.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# Native dependencies — `npmRebuild: true` below is the current
# mechanism: electron-builder 25.x dropped the `nativeDependencies`
# array (replaced by the global flag). For better-sqlite3 specifically,
# the prebuilt `.node` binary is unpacked from the asar archive
# (`asarUnpack` above) so Node can dlopen it via the standard
# `require()` path at runtime.

# Use prebuilt better-sqlite3 binaries. v11.10.0 ships electron-v128
# prebuilds (Electron 32's ABI) for win32-x64, downloaded via
# `prebuild-install --runtime=electron --target=32.3.3`. The local
# build/Release/better_sqlite3.node has been replaced with the
# electron-v128 prebuild (verified by process.dlopen failing on Node
# 24's ABI 137 with "compiled against NODE_MODULE_VERSION 128").
# Toggling this to `true` would force a node-gyp source compile, which
# requires Visual Studio Build Tools (not installed locally).
npmRebuild: false

# Extra resources bundled alongside the binary so the production main
# process can find the local Next.js server entry point.
#
# T020.2: switch from the in-process next() programmatic API
# to the standalone Next.js output. Standalone emits a self-contained
# server.js entry point at apps/web/.next/standalone/apps/web/server.js
# with its own bundled node_modules, so we ship that whole tree under
# resources/web/. Standalone does NOT copy .next/static (client
# bundles) or public/ automatically -- those must be moved alongside
# the servers apps/web/ siblings, otherwise every CSS/JS request 404s
# at runtime.
#
# Resulting layout under resources/:
#   web/
#     apps/web/server.js     <- entry point spawned by src/main/server.ts
#     apps/web/.next/...     <- next runtime artifacts (manifests, etc.)
#     apps/web/.next/static/ <- client-side bundles (CSS/JS)
#     apps/web/public/       <- static files
#     apps/web/package.json
#     node_modules/          <- bundled by standalone (includes react)
#     packages/              <- workspace deps
extraResources:
  - from: "../web/.next/standalone"
    to: "web"
    filter:
      - "**/*"
  - from: "../web/.next/static"
    to: "web/apps/web/.next/static"
    filter:
      - "**/*"
  - from: "../web/public"
    to: "web/apps/web/public"
    filter:
      - "**/*"
  # T019 icon. Ship the multi-size .ico as an extraResource so the
  # BrowserWindow `icon` option in src/main/index.ts can resolve it
  # at runtime via process.resourcesPath. electron-builder's `win.icon`
  # above is what sets the EXE icon shown in Explorer/Task Manager;
  # this entry drives the in-window title-bar/Alt-Tab icon.
  - from: "build/icon.ico"
    to: "build/icon.ico"

# ----- Windows target -----
win:
  # T019 icon. Multi-size .ico (16/32/48/64/128/256) generated from
  # public/logo_EN.png (1200x880 RGBA, restored from git history — it
  # was replaced by logo_EN.webp in commit 2ccee68). electron-builder
  # picks this up for the EXE icon shown in Explorer/Taskbar/Start Menu.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Authenticode signing. T025 smoke validation runs unsigned (no EV
  # cert acquired yet — that lands in Phase 8 per the multi-platform
  # expansion plan). The signing env vars (`CSC_LINK`,
  # `CSC_KEY_PASSWORD`) are read from the build environment in
  # production; for the smoke run we leave the cert lines commented
  # out so electron-builder 25.x does not try to open a literal
  # `${env.CSC_LINK}` path. To re-enable signing, uncomment and
  # export the env vars before `pnpm --filter desktop build`.
  # certificateFile: ${env.CSC_LINK}
  # certificatePassword: ${env.CSC_KEY_PASSWORD}
  # publisherName: "Masar X"
  # verifyUpdateCodeSignature: true
  # Use SHA-256 timestamping to satisfy Windows SmartScreen reputation
  # requirements for new certificates.
  # signingHashAlgorithms:
  #   - sha256
  # rfc3161TimeStampServer: http://timestamp.digicert.com
  # timeStampServer: http://timestamp.digicert.com

nsis:
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
  # Display name in Add/Remove Programs. The full description
  # text (used in the EXE's Properties → Details tab on Windows
  # and the macOS Finder Get Info pane) comes from
  # `extraMetadata.description` above; electron-builder 25.x does
  # not expose a separate NSIS-level productDescription field.
  uninstallDisplayName: Masar X — An integrated educational platform for university students.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Masar X
  # Disable the differential-update package. electron-builder otherwise
  # tries to compute a partial-update `.7z` against the previous release
  # (line-7 section in the NSIS installer). On a fresh local build (no
  # previous release on disk) the diff engine produces a corrupt archive,
  # which the NSIS extractor then rejects with `The archive is corrupt`.
  # We ship full installers and let the GitHub auto-updater use them as-is
  # (T023). Setting this to `false` removes the diff step entirely.
  differentialPackage: false
  # On uninstall, wipe `%LOCALAPPDATA%\Programs\masarx\` (the SQLite cache,
  # encrypted auth session, local HTTP cache). Otherwise a reinstall picks
  # up stale state and the first launch may crash.
  deleteAppDataOnUninstall: true
  # The desktop app launches the local Next.js server; the installer
  # therefore registers the URL protocol so the OAuth flow can return
  # to the desktop app from the system browser.
  include: build/installer.nsh

portable:
  artifactName: "${productName}-Portable-${version}-${arch}.${ext}"

# ----- macOS target -----
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Developer ID signing + notarization. Apple notarization in
  # electron-builder 25.x reads APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
  # and APPLE_TEAM_ID from the environment automatically (the old
  # `notarizeAppleId` / `notarizeAppleIdPassword` / `notarizeTeamId`
  # fields were removed in 25.x — the env vars are the only config
  # knob now). APPLE_IDENTITY is still the explicit signing identity
  # override.
  identity: ${env.APPLE_IDENTITY}
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The Electron helper needs the same entitlements.
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Masar X

dmg:
  sign: false

# ----- Linux target -----
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: Education
  vendor: Masar X
  maintainer: ops@masarx.ai
  synopsis: Learn programming with Masar X
  description: |
    Masar X is a learning platform for beginners and people who want
    to learn programming from scratch in a practical way.
  desktop:
    entry:
      Name: Masar X
      Comment: Learn programming with Masar X
      Categories: Education
      Keywords: education;programming;learning;
      MimeType: x-scheme-handler/masarx;
  # GPG signing. Provide the GPG private key via env var (base64-encoded
  # ASCII-armored) or via a file path. The build host's gpg-agent must
  # be available; for headless CI use `--pinentry-mode loopback`.
  executableName: masarx

# Auto-update channel (T023) — GitHub Releases feed.
# The release artifacts (NSIS .exe, portable .exe, latest.yml, blockmaps)
# are published to a SEPARATE public repo, `fotedev/masarx-releases`,
# while the source code stays in the private `fotedev/Masar-x-next` repo.
# This split is required because GitHub Releases on a private repo are
# also private — anonymous `electron-updater` would 404 on the
# `latest.yml` fetch, and the website's download link would 404 too.
# See AGENTS.md gotcha #16 + the "Release distribution" section for the
# full rationale.
#
# `electron-updater` reads from the GitHub Releases API for
# `fotedev/masarx-releases`. `releaseType: release` → stable channel,
# `releaseType: prerelease` → beta channel. The PAT stored as the
# `GH_RELEASES_TOKEN` repo secret in `fotedev/Masar-x-next` has `repo`
# scope on `fotedev/masarx-releases` (Fine-grained token) so the
# release workflow can write there. End users read the release feed
# anonymously because `masarx-releases` is public.
# publisherName on Windows must match the code-signing certificate's CN.
publish:
  - provider: github
    owner: fotedev
    repo: masarx-releases
    releaseType: release
    channel: stable
  - provider: github
    owner: fotedev
    repo: masarx-releases
    releaseType: prerelease
    channel: beta
